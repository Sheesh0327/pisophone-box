name: Code quality

# Runs on pushes to main and on pull requests: repository security rules, the firmware's format and host tests, the setup program's
# tests (with a pretend board), the dashboard's scripts in a browser, and the firmware compiled for the ESP32-C3.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-rules:
    name: Security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check repository security rules
        run: sh scripts/check_security_rules.sh

  firmware-style-and-tests:
    name: Firmware format and host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmbedtls-dev
          pip install clang-format==23.1.2 cryptography
      - name: Check C++ formatting
        working-directory: esp32_firmware
        run: |
          FILES=$(ls src/*.cpp include/*.h host_tests/*.cpp | grep -vE "include/(WebDashboard|SuperAdminTemplate|WebAssets)")
          clang-format --dry-run --Werror $FILES
      - name: Check protocol test vectors are reproducible
        run: |
          python3 protocol/gen_vectors.py
          git diff --exit-code protocol
      - name: Check generated web assets are up to date
        run: python3 scripts/embed_web.py --check
      - name: Run host tests
        run: sh esp32_firmware/host_tests/run.sh

  setup-program:
    name: Setup program and owner tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmbedtls-dev
          pip install cryptography pyflakes qrcode pillow
      - name: Lint the setup program
        run: python3 -m pyflakes setup/pisophone_setup.py tests scripts/make_slot_licenses.py scripts/publish_firmware_ota.py scripts/tests
      - name: Setup program (pretend board, license keys against the firmware's own code, time cards)
        run: python3 tests/test_setup.py
      - name: Firmware publisher, admin QR and recovery code tools
        run: |
          python3 scripts/tests/test_publish_firmware.py
          python3 scripts/tests/test_admin_qr.py
          python3 scripts/tests/test_recovery_code.py

  dashboard-scripts:
    name: Dashboard scripts in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0
      - name: Install Playwright
        run: pip install -q playwright==1.63.0 && playwright install --with-deps chromium
      - name: The dashboard's own scripts
        run: |
          python3 scripts/tests/test_portal_orphans_ui.py
          python3 scripts/tests/test_portal_session_ui.py
          python3 scripts/tests/test_portal_theme_ui.py
          python3 scripts/tests/test_portal_license_ui.py

  firmware-build:
    name: Firmware build (esp32-c3-dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-c3-${{ hashFiles('esp32_firmware/platformio.ini', 'esp32_firmware/envs/*.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Compile
        working-directory: esp32_firmware
        run: pio run -e esp32-c3-dev
      - name: Compile the production (encrypted layout) build
        working-directory: esp32_firmware
        run: pio run -e esp32-c3-production-encrypted
